[global]
   workgroup = WORKGROUP
   server string = Servidor de Arquivos Corporativo
   security = user
   map to guest = Bad User
   max log size = 1000
   obey pam restrictions = Yes
   pam password change = Yes
   unix password sync = yes
   server role = standalone server
   usershare allow guests = Yes

[publico]
   guest ok = Yes
   path = /compartilhado/publico
   read only = No

[projetos]
   create mask = 0660
   directory mask = 0770
   force group = devs
   path = /compartilhado/projetos
   read only = No
   valid users = @devs @diretoria

[backups]
   create mask = 0660
   directory mask = 0770
   path = /compartilhado/backups
   read only = No
   valid users = @backup_mgr

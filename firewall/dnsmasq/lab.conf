# Interface de escuta para os serviços de rede interna (LAN)
interface=enp0s9
bind-dynamic

# Domínio local do laboratório
domain=empresa.local
local=/empresa.local/
expand-hosts

# Configuração do servidor DHCP (Faixa de IPs distribuídos aos clientes e concessão de 12h)
dhcp-range=10.0.2.100,10.0.2.200,255.255.255.0,12h

# Opções de rede enviadas aos clientes DHCP (Gateway padrão e Servidor DNS)
dhcp-option=option:router,10.0.2.1
dhcp-option=option:dns-server,10.0.2.1

# Atribuição de IP estático via DHCP com base no endereço MAC do servidor de arquivos
dhcp-host=08:00:27:bc:7d:98,files,10.0.2.10

# Registos estáticos de DNS para resolução de nomes interna
host-record=fw.empresa.local,10.0.2.1
host-record=db.empresa.local,10.0.3.10
host-record=files.empresa.local,10.0.2.10

# Servidor DNS de encaminhamento externo (Forwarder público)
server=8.8.8.8

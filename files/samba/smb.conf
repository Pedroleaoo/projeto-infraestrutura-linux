workgroup = WORKGROUP
server string = %h server (Samba, Ubuntu)
log file = /var/log/samba/log.%m
max log size = 1000
logging = file
panic action = /usr/share/samba/panic-action %d
server role = standalone server
obey pam restrictions = yes
unix password sync = yes
passwd program = /usr/bin/passwd %u
passwd chat = *Enter\snew\s*password:* %n %Retype\snew\s*password:* %n %password\supdated\ssuccessfully\.
pam password change = yes
map to guest = bad user
usershare allow guests = yes

[printers]
comment = All Printers
browseable = no
path = /var/tmp
printable = yes
guest ok = no
read only = yes
create mask = 0700

[print$]
comment = Printer Drivers
path = /var/lib/samba/printers
browseable = yes
read only = yes
guest ok = no

[publico]
path = /compartilhado/publico
browseable = yes
writable = yes
guest ok = yes
read only = no

[projetos]
path = /compartilhado/projetos
browseable = yes
writable = yes
valid users = @devs, @diretoria
force group = devs
create mask = 0660
directory mask = 0770

[backups]
path = /compartilhado/backups
browseable = yes
writable = yes
valid users = @backup_mgr
create mask = 0660
directory mask = 0770

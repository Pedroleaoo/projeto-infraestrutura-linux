# ==============================================================================
# Configuração de Autenticação de Clientes PostgreSQL (pg_hba.conf)
# Define quais hosts podem ligar-se à base de dados e com que método de autenticação
# ==============================================================================

# Conexão local do próprio servidor via UNIX socket
# Tipo  Base        Utilizador  Endereço        Método
local   all         all                         peer

# Conexão local IPv4 para o administrador
host    all         all         127.0.0.1/32    scram-sha-256

# Conexão permitida para a rede interna da aplicação na DMZ/LAN
host    empresa_db  app_user    10.0.2.0/24     scram-sha-256
